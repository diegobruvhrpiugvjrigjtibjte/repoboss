[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "repoboss"
version = "0.2.0"
description = "Create verifiable code-repair challenges from your own repositories, in many languages, and put AI coding agents to the test."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "fastapi>=0.110",
    "jinja2>=3.1",
    "uvicorn>=0.29",
    "tree-sitter-language-pack>=1.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
]

[project.scripts]
repoboss = "repoboss.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/repoboss"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "docs", "README.md", "LICENSE", "CONTRIBUTING.md", "SECURITY.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: needs a working Docker daemon (skipped otherwise)",
]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "S603",  # subprocess without shell: we always pass argv lists, never shell=True
    "S607",  # partial executable path: "docker", "git", "taskkill" are resolved from PATH on purpose
    "S101",  # assert is fine in tests
    "S311",  # random is used for reproducible bug selection, not for security
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/repoboss"]
